on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  helm:
    container:
      image: alpine/helm:4.1.1
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          echo "helm_registry=ghcr.io" >> $GITHUB_ENV
          echo "helm_username=${{ github.actor }}" >> $GITHUB_ENV
          echo "helm_password=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV
          echo "registry_namespace=$GITHUB_REPOSITORY" >> $GITHUB_ENV
      - if: github.event_name == 'pull_request'
        run: ./pipeline.sh push-rc
      - if: github.event_name == 'push'
        run: ./pipeline.sh push
