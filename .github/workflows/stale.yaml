name: stale

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@28ca1036281a5e5922ead5184a1bbf96e5fc984e # v9.0.0
        with:
          stale-issue-message: >
            This issue has been inactive for 60 days. Please update or it will
            be closed in 14 days.
          stale-pr-message: >
            This pull request has been inactive for 60 days. Please update or
            it will be closed in 14 days.
          close-issue-message: "Closing due to inactivity."
          close-pr-message: "Closing due to inactivity."
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "security,enhancement"
